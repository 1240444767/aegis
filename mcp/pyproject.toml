[project]
name = "aegis-mcp"
version = "0.1.0"
description = "Aegis 管理端 MCP 服务：让 AI 助手凭 MCP 密钥查询与管理 Aegis（应用、用户、会员、积分、工单、审计等）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28",
]

[project.optional-dependencies]
http = ["uvicorn>=0.34"]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
aegis-mcp = "aegis_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
