name: Build deploy bundle

on:
  push:
    branches:
      - starbox
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/go-ci.yml'
      - '.github/workflows/console-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide components from changed paths
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "console=true" >> "$GITHUB_OUTPUT"
            echo "no usable base commit -> build both"
            exit 0
          fi
          git diff --name-only "$BASE" "${{ github.sha }}" > /tmp/changed.txt
          server=false
          console=false
          while IFS= read -r f; do
            case "$f" in
              aegis-console/*) console=true ;;
              *) server=true ;;
            esac
          done < /tmp/changed.txt
          if grep -qE '^(go\.mod|go\.sum|deploy/docker/|\.github/workflows/deploy-bundle\.yml)' /tmp/changed.txt; then
            server=true
            console=true
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "console=$console" >> "$GITHUB_OUTPUT"
          echo "changed files: $(wc -l < /tmp/changed.txt) -> server=$server console=$console"

      - name: Build server binary
        if: steps.diff.outputs.server == 'true'
        run: |
          set -euo pipefail
          docker build --target build -f deploy/docker/Dockerfile -t aegis-server-build .
          docker create --name aegis-srv-tmp aegis-server-build >/dev/null
          mkdir -p bundle
          docker cp aegis-srv-tmp:/usr/local/bin/aegis-server bundle/aegis-server
          docker rm -f aegis-srv-tmp >/dev/null
          chmod 755 bundle/aegis-server
          ls -lh bundle/aegis-server

      - name: Build console standalone
        if: steps.diff.outputs.console == 'true'
        run: |
          set -euo pipefail
          docker build -f deploy/docker/console.Dockerfile \
            --build-arg AEGIS_API_BACKEND=http://aegis-server:8088 \
            -t aegis-console-build aegis-console
          docker create --name aegis-console-tmp aegis-console-build >/dev/null
          mkdir -p bundle/console
          docker cp aegis-console-tmp:/app/. bundle/console/
          docker rm -f aegis-console-tmp >/dev/null
          test -f bundle/console/server.js
          ls -lh bundle/console/server.js

      - name: Pack bundle
        run: |
          set -euo pipefail
          mkdir -p bundle
          components=""
          if [ -f bundle/aegis-server ]; then components='"server"'; fi
          if [ -d bundle/console ]; then
            if [ -n "$components" ]; then components="$components,\"console\""; else components='"console"'; fi
          fi
          if [ -z "$components" ]; then
            echo "no component was built, refusing to publish an empty bundle" >&2
            exit 1
          fi
          tar -czf aegis-bundle.tar.gz -C bundle .
          tar_sha=$(sha256sum aegis-bundle.tar.gz | cut -d' ' -f1)
          printf '{"sha":"%s","built_at":"%s","branch":"starbox","components":[%s],"tar":"aegis-bundle.tar.gz","tar_sha256":"%s"}\n' \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$components" "$tar_sha" > bundle.json
          cat bundle.json
          ls -lh aegis-bundle.tar.gz

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest aegis-bundle.tar.gz bundle.json --clobber
          else
            gh release create latest aegis-bundle.tar.gz bundle.json \
              --title "Aegis build bundle" \
              --notes "CI 自动构建产物，供生产服务器 aegis-autosync 下载使用。"
          fi
          gh release view latest --json assets --jq '.assets[].name'
